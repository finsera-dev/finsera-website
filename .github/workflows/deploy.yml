name: Deploy to GitHub Pages

on:
  # Deploy on every push to the default branch
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Grant the token the permissions Pages deployment needs
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let a new push cancel an in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repository root (the static site lives at the top level)
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
